name: Supabase backup

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logical-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Create database backup
        run: npm run db:backup
      - name: Show redacted backup diagnostics
        if: failure()
        run: |
          if [ -d backups/supabase ]; then
            find backups/supabase -maxdepth 2 -type f \( -name INCOMPLETE.txt -o -name roles-not-included.txt \) -print -exec sed -n '1,200p' {} \;
          else
            echo "No backup directory was created."
          fi
      - name: Verify the new backup
        run: |
          latest="$(find backups/supabase -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          npm run db:backup:verify -- "$latest"
      - name: Back up Storage object bytes
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run storage:backup
      - name: Verify the Storage backup
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          latest="$(find backups/storage -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          npm run storage:backup:verify -- "$latest"
      - name: Warn when Storage backup is not configured
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::warning::Storage object backup skipped. Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-backup-${{ github.run_id }}
          path: |
            backups/supabase/
            backups/storage/
          if-no-files-found: warn
          retention-days: 7
