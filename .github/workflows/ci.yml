name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key
      LEAGUE_INVITE_CODE: local-ci-invite
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: python -m unittest discover -s model/tests
      - run: npm run build

  database-protections:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run test:db
      - name: Install the desktop test browser
        run: npx playwright install --with-deps chromium
      - name: Run desktop end-to-end checks
        run: |
          eval "$(npx supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export LEAGUE_INVITE_CODE="local-ci-invite"
          export NEXT_PUBLIC_APP_URL="http://127.0.0.1:3000"
          npm run test:e2e -- --project=desktop-chromium
      - if: always()
        run: npx supabase stop --no-backup
